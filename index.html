<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Keyframe 2D Animation Studio</title>
<style>
:root{--bg:#181818;--panel:#262626;--panel2:#303030;--panel3:#202020;--line:#3b3b3b;--btn:#3a3a3a;--hover:#4a4a4a;--text:#ddd;--muted:#999;--accent:#e88a16;--sel:#365b83;--danger:#c94b4b}
*{box-sizing:border-box}html,body{height:100%;margin:0}body{background:var(--bg);color:var(--text);font:12px/1.3 Inter,system-ui,sans-serif;overflow:hidden;user-select:none}
#app{height:100%;display:grid;grid-template-rows:34px 1fr 205px}
header{display:flex;align-items:center;gap:3px;padding:3px 6px;background:#303030;border-bottom:1px solid #111;overflow:auto;white-space:nowrap}
button,select,input{font:inherit;color:var(--text);background:var(--btn);border:1px solid #555;border-radius:3px}button{padding:4px 8px;cursor:pointer}button:hover{background:var(--hover)}button.active{background:var(--accent);color:#111;border-color:#f2a33d}button.icon{width:28px;padding:4px 0}.brand{font-weight:800;color:#f08a17;margin-right:4px}.menu{font-weight:600}.sep{width:1px;height:18px;background:#555;margin:0 4px}.spacer{flex:1}.status{color:#aaa;font-family:monospace}
#middle{display:grid;grid-template-columns:48px minmax(0,1fr) 285px;min-height:0}
#tools{background:#252525;border-right:1px solid #111;padding:5px 4px;display:flex;flex-direction:column;gap:3px}.toolgroup{border-bottom:1px solid #444;padding-bottom:5px;margin-bottom:2px}.toolgroup:last-child{border:0}.toolhint{text-align:center;color:#777;font-size:9px;margin:2px}
#viewport{position:relative;overflow:hidden;background:#111;display:flex;align-items:center;justify-content:center;touch-action:none}
#canvas{width:min(960px,calc(100% - 30px));height:auto;aspect-ratio:16/9;background:#fff;box-shadow:0 8px 35px #000;cursor:crosshair;touch-action:none}
#status{position:absolute;left:10px;bottom:10px;background:#111d;padding:6px 8px;border:1px solid #444;border-radius:3px;color:#bbb;font-family:monospace;pointer-events:none}
#side{background:#292929;border-left:1px solid #111;overflow:auto;padding:6px}.panel{background:#232323;border:1px solid #3c3c3c;border-radius:3px;margin-bottom:6px}.panelhead{height:25px;display:flex;align-items:center;padding:0 7px;background:#303030;border-bottom:1px solid #414141;font-weight:700}.panelbody{padding:6px}.row{display:flex;gap:5px;align-items:center;margin:4px 0}.row>*{min-width:0}.grid2{display:grid;grid-template-columns:1fr 1fr;gap:5px}.grid3{display:grid;grid-template-columns:1fr 1fr 1fr;gap:4px}.field{display:flex;flex-direction:column;gap:2px;color:#999}.field input,.field select{width:100%;height:25px;padding:3px 5px}.wide{flex:1}.num{width:65px}.check{display:flex;align-items:center;gap:4px;color:#aaa}
#layers{background:#1b1b1b;max-height:190px;overflow:auto}.layer{display:flex;align-items:center;gap:5px;height:27px;padding:3px 5px;border-bottom:1px solid #292929;cursor:pointer}.layer:hover{background:#333}.layer.sel{background:var(--sel)}.layer .eye{width:20px;text-align:center}.layer .name{flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.layer .badge{font-size:9px;color:#aaa}
#palette{display:flex;gap:3px;flex-wrap:wrap}.sw{width:22px;height:22px;border:1px solid #777;border-radius:3px;cursor:pointer}.sw:hover{outline:1px solid #eee}
#timeline{background:#242424;border-top:1px solid #111;display:grid;grid-template-rows:42px 1fr;min-height:0}.controls{display:flex;align-items:center;gap:5px;padding:5px 7px;background:#303030;flex-wrap:wrap}.controls .fieldinline{display:flex;align-items:center;gap:3px;color:#aaa}.controls input{height:25px;padding:3px 5px}.tiny{width:55px}.transport{font-size:15px;width:30px;padding:3px}
#frames{position:relative;overflow:auto;border-top:1px solid #111}.track{position:relative;min-width:1100px}.ruler{height:27px;background:#202020;position:sticky;top:0;z-index:5;border-bottom:1px solid #444}.tick{position:absolute;top:0;height:27px;border-left:1px solid #555;color:#aaa;padding-left:3px;font-size:10px}.layerrow{height:34px;border-bottom:1px solid #333;position:relative;background:#262626}.rowlabel{position:sticky;left:0;z-index:4;width:110px;height:34px;background:#292929;border-right:1px solid #444;padding:8px 5px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.cell{position:absolute;top:4px;height:26px;width:23px;border:1px solid #444;background:#202020;cursor:pointer}.cell:hover{border-color:#aaa}.cell.key{background:var(--accent);border-color:#ffb65b}.cell.exposure{background:#50667d}.cell.empty{background:#1e1e1e}.playhead{position:absolute;top:0;bottom:0;width:2px;background:#ef4242;z-index:6;pointer-events:none}.framecol{position:absolute;top:0;bottom:0;width:24px;border-left:1px solid #2f2f2f;pointer-events:none}.selectionBox{position:absolute;border:1px dashed #f2a33d;background:#f2a33d22;pointer-events:none}
@media(max-width:900px){#middle{grid-template-columns:44px minmax(0,1fr) 235px}.rowlabel{width:90px}}
</style>
</head>
<body>
<div id="app">
<header>
 <span class="brand">Keyframe</span><span>2D Animation Studio</span><span class="sep"></span>
 <button onclick="newProject()">New</button><button onclick="saveProject()">Save</button><button onclick="openProject()">Open</button>
 <button onclick="undo()">Undo</button><button onclick="redo()">Redo</button><span class="sep"></span>
 <button onclick="exportPNG()">PNG</button><button onclick="exportWebM()">WebM</button>
 <span id="info">Frame 1</span>
</header>
<div id="middle">
 <aside id="tools">
  <button data-tool="brush" class="active" title="Brush B">✎</button>
  <button data-tool="eraser" title="Eraser E">⌫</button>
  <button data-tool="line" title="Line">╱</button>
  <button data-tool="rect" title="Rectangle">□</button>
  <button data-tool="ellipse" title="Ellipse">○</button>
  <button data-tool="fill" title="Fill">▧</button>
  <button data-tool="move" title="Move G">✥</button>
  <button data-tool="rotate" title="Rotate R">⟳</button>
  <button data-tool="scale" title="Scale S">⤢</button>
  <button data-tool="select" title="Rectangle Select">▣</button>
  <button data-tool="pivot" title="Set Pivot">⊙</button>
 </aside>
 <main id="viewport"><canvas id="canvas" width="960" height="540"></canvas><div id="status"></div></main>
 <aside id="side">
  <div class="section"><div class="title">Layers</div><div id="layers"></div>
   <div class="row"><button onclick="addLayer()">＋</button><button onclick="duplicateLayer()">Duplicate</button><button onclick="deleteLayer()">−</button><button onclick="moveLayer(-1)">↑</button><button onclick="moveLayer(1)">↓</button></div>
  </div>
  <div class="section"><div class="title">Transform</div>
   <div class="grid">
    <label>X<input id="px" type="number" value="0" step="1"></label><label>Y<input id="py" type="number" value="0" step="1"></label>
    <label>Rotation<input id="rot" type="number" value="0" step="1"></label><label>Scale<input id="scale" type="number" value="1" step=".01"></label>
    <label>Opacity<input id="opacity" type="number" value="1" min="0" max="1" step=".01"></label><label>Blend<select id="blend"><option>source-over</option><option>multiply</option><option>screen</option><option>overlay</option><option>lighter</option></select></label>
   </div>
   <div class="row"><input id="lname" type="text" value="Layer 1" onchange="renameLayer()"></div>
  </div>
  <div class="section"><div class="title">Brush</div>
   <div class="row">Color <input id="color" type="color" value="#111111"> Size <input id="size" type="number" value="8" min="1" max="200" style="width:65px"></div>
   <div class="row">Stabilizer <input id="stabilizer" type="number" value="3" min="0" max="20" style="width:55px"> Gap <input id="fillGap" type="number" value="8" min="0" max="30" style="width:55px"></div>
   <div class="row"><label><input id="fillShapes" type="checkbox"> Fill shapes</label><label><input id="onion" type="checkbox" checked> Onion skin</label></div>
   <div id="palette"></div>
  </div>
  <div class="section"><div class="title">Animation</div>
   <div class="grid"><label>FPS<input id="fps" type="number" value="24" min="1" max="120"></label><label>End<input id="end" type="number" value="120" min="1"></label></div>
   <div class="row"><button onclick="insertKey()">Insert Key</button><button onclick="deleteKey()">Delete Key</button></div>
  </div>
</aside>
</div>
<div id="timeline">
 <div id="controls">
  <button onclick="step(-1)">◀</button><button id="play" onclick="togglePlay()">▶</button><button onclick="step(1)">▶</button>
  <span>Frame</span><input id="frame" class="tiny" type="number" value="1" min="1">
  <button onclick="copyFrame()">Copy</button><button onclick="pasteFrame()">Paste</button><button onclick="duplicateFrame()">Duplicate</button>
 </div>
 <div id="frames"><div id="track"></div></div>
</div>
</div>
<input id="file" type="file" accept=".json,application/json" hidden>
<script>
const C=document.getElementById('canvas'),ctx=C.getContext('2d');
let S={frame:1,start:1,fps:24,end:120,tool:'brush',color:'#111111',size:8,layers:[],sel:0,undo:[],redo:[],playing:false,onion:true,onionPrev:2,onionNext:2};
let drawing=false,start=null,current=null,startTransform=null,timer=null,clipboard=null,selection=null,pivotDrag=false,selectedStrokes=[];
const $=id=>document.getElementById(id);
function makeLayer(name){return{name,visible:true,locked:false,opacity:1,x:0,y:0,rotation:0,scale:1,blend:'source-over',pivotX:0,pivotY:0,frames:{},keys:{}}}
function cleanProject(){return{frame:S.frame,start:S.start,fps:S.fps,end:S.end,tool:S.tool,color:S.color,size:S.size,onion:S.onion,onionPrev:S.onionPrev,onionNext:S.onionNext,layers:S.layers,sel:S.sel}}
function snapshot(){return JSON.stringify(cleanProject())}
function pushHistory(){S.undo.push(snapshot());if(S.undo.length>50)S.undo.shift();S.redo=[]}
function restore(x){const a=JSON.parse(x);Object.assign(S,a);S.playing=false;render()}
function undo(){if(S.undo.length<=1)return;const now=S.undo.pop();S.redo.push(now);restore(S.undo[S.undo.length-1])}
function redo(){if(!S.redo.length)return;const x=S.redo.pop();S.undo.push(x);restore(x)}
function newProject(){
 clearInterval(timer);S={frame:1,start:1,fps:24,end:120,tool:'brush',color:'#111111',size:8,layers:[makeLayer('Layer 1')],sel:0,undo:[],redo:[],playing:false,onion:true};
 pushHistory();render();
}
function cur(){return S.layers[S.sel]}
function ensureFrame(){if(!cur().frames[S.frame])cur().frames[S.frame]=[]}
function frameStrokes(l,f){return l.frames[f]||null}
function nearestFrame(l,f){const n=Object.keys(l.frames).map(Number).filter(x=>x<=f).sort((a,b)=>b-a)[0];return n?l.frames[n]:null}
function transformAt(l,f){
 const ks=Object.keys(l.keys).map(Number).sort((a,b)=>a-b);if(!ks.length)return{x:l.x,y:l.y,rotation:l.rotation,scale:l.scale,opacity:l.opacity,pivotX:l.pivotX,pivotY:l.pivotY};
 let a=ks.filter(x=>x<=f).pop(),b=ks.find(x=>x>=f);
 if(a===undefined)a=ks[0];if(b===undefined)b=a;if(a===b)return Object.assign({pivotX:l.pivotX,pivotY:l.pivotY},l.keys[a]);
 const A=l.keys[a],B=l.keys[b],t=(f-a)/(b-a);return{x:A.x+(B.x-A.x)*t,y:A.y+(B.y-A.y)*t,rotation:A.rotation+(B.rotation-A.rotation)*t,scale:A.scale+(B.scale-A.scale)*t,opacity:A.opacity+(B.opacity-A.opacity)*t,pivotX:(A.pivotX??l.pivotX)+((B.pivotX??l.pivotX)-(A.pivotX??l.pivotX))*t,pivotY:(A.pivotY??l.pivotY)+((B.pivotY??l.pivotY)-(A.pivotY??l.pivotY))*t};
}
const rasterCache=new Map();
function drawRaster(s){let img=rasterCache.get(s.src);if(img&&img.complete){ctx.drawImage(img,0,0);return}if(!img){img=new Image();img.onload=()=>render();img.src=s.src;rasterCache.set(s.src,img)}}
function drawStrokes(d,alpha=1){
 if(!d)return;
 for(const s of d){if(s.type==='raster'){ctx.globalAlpha=alpha;drawRaster(s);continue}ctx.beginPath();ctx.lineWidth=s.size;ctx.lineCap='round';ctx.lineJoin='round';ctx.strokeStyle=s.color;ctx.fillStyle=s.color;ctx.globalAlpha=alpha;
  if(s.type==='path'){if(!s.pts.length)continue;ctx.moveTo(s.pts[0][0],s.pts[0][1]);for(let i=1;i<s.pts.length;i++)ctx.lineTo(s.pts[i][0],s.pts[i][1]);if(s.pts.length===1)ctx.lineTo(s.pts[0][0]+.01,s.pts[0][1]);ctx.stroke()}
  else if(s.type==='line'){ctx.moveTo(s.x1,s.y1);ctx.lineTo(s.x2,s.y2);ctx.stroke()}
  else if(s.type==='rect'){ctx.rect(s.x,s.y,s.w,s.h);s.fill?ctx.fill():ctx.stroke()}
  else if(s.type==='ellipse'){ctx.ellipse(s.x,s.y,Math.abs(s.rx),Math.abs(s.ry),0,0,Math.PI*2);s.fill?ctx.fill():ctx.stroke()}
 }
}
function drawLayer(l){
 if(!l.visible)return;
 const d=nearestFrame(l,S.frame);
 if(!d&&!(l.keys[S.frame]))return;
 const drawAt=(frame,alpha)=>{
   const strokes=nearestFrame(l,frame);if(!strokes)return;
   const tr=transformAt(l,frame);
   ctx.save();ctx.globalCompositeOperation=l.blend;ctx.globalAlpha=alpha;
   ctx.translate(C.width/2+tr.x,C.height/2+tr.y);ctx.translate(tr.pivotX??l.pivotX,tr.pivotY??l.pivotY);
   ctx.rotate(tr.rotation*Math.PI/180);ctx.scale(tr.scale,tr.scale);
   ctx.translate(-(tr.pivotX??l.pivotX),-(tr.pivotY??l.pivotY));ctx.translate(-C.width/2,-C.height/2);
   drawStrokes(strokes,1);ctx.restore();
 };
 if($('onion').checked){
   const prev=+$('onionPrev').value||0,next=+$('onionNext').value||0;
   for(let i=prev;i>=1;i--){const f=S.frame-i;if(f>=S.start)drawAt(f,.10/(prev||1)*i)}
   for(let i=1;i<=next;i++){const f=S.frame+i;if(f<=S.end)drawAt(f,.08/(next||1)*(next-i+1))}
 }
 drawAt(S.frame,transformAt(l,S.frame).opacity);
}
function render(){
 ctx.clearRect(0,0,C.width,C.height);ctx.fillStyle='#fff';ctx.fillRect(0,0,C.width,C.height);
 for(const l of S.layers)drawLayer(l);
 syncUI();renderLayers();renderTimeline();$('info').textContent='Frame '+S.frame+' / '+S.end;
 $('status').textContent=S.tool.toUpperCase()+'  |  Layer '+(S.sel+1)+'  |  '+S.size+' px';if(selection&&S.tool==='select')drawSelection();if(S.tool==='pivot'){ctx.save();ctx.strokeStyle='#e88a16';ctx.beginPath();ctx.moveTo(C.width/2+cur().x+cur().pivotX-8,C.height/2+cur().y+cur().pivotY);ctx.lineTo(C.width/2+cur().x+cur().pivotX+8,C.height/2+cur().y+cur().pivotY);ctx.moveTo(C.width/2+cur().x+cur().pivotX,C.height/2+cur().y+cur().pivotY-8);ctx.lineTo(C.width/2+cur().x+cur().pivotX,C.height/2+cur().y+cur().pivotY+8);ctx.stroke();ctx.restore()}
}
function renderLayers(){
 const box=$('layers');box.innerHTML='';
 S.layers.slice().reverse().forEach((l,ri)=>{const i=S.layers.length-1-ri,d=document.createElement('div');d.className='layer '+(i===S.sel?'sel':'');
  const eye=document.createElement('span');eye.className='eye';eye.textContent=l.visible?'◉':'○';eye.onclick=e=>{e.stopPropagation();l.visible=!l.visible;render()};
  const n=document.createElement('span');n.className='name';n.textContent=l.name;
  const b=document.createElement('span');b.className='badge';b.textContent=l.locked?'🔒':'🔓';b.title='Toggle lock';b.onclick=e=>{e.stopPropagation();l.locked=!l.locked;pushHistory();render()};
  n.ondblclick=e=>{e.stopPropagation();const v=prompt('Layer name',l.name);if(v!==null){l.name=v.trim()||l.name;pushHistory();render()}};
  d.append(eye,n,b);d.onclick=()=>{S.sel=i;render()};box.appendChild(d);
 });
}
function renderTimeline(){
 const t=$('track');t.innerHTML='';const ruler=document.createElement('div');ruler.className='ruler';
 for(let f=S.start;f<=S.end;f++){if(f%5===1||f===S.start){const x=document.createElement('div');x.className='tick';x.style.left=(f-S.start)*24+'px';x.textContent=f;ruler.appendChild(x)}}
 t.appendChild(ruler);
 S.layers.slice().reverse().forEach((l,ri)=>{const row=document.createElement('div');row.className='layerrow';const lab=document.createElement('div');lab.className='rowlabel';lab.textContent=l.name;row.appendChild(lab);
  for(let f=S.start;f<=S.end;f++){
   const exact=!!l.frames[f], key=!!l.keys[f], held=!exact&&!!nearestFrame(l,f);
   if(exact||key||held){const c=document.createElement('div');c.className='cell '+(exact?'key':key?'exposure':'empty');c.style.left=(f-S.start)*24+110+'px';c.title=exact?'Drawing '+f:key?'Transform key '+f:'Held exposure '+f;c.onclick=()=>{S.sel=S.layers.indexOf(l);go(f)};row.appendChild(c)}
 }
  t.appendChild(row);
 });
 const ph=document.createElement('div');ph.className='playhead';ph.style.left=(S.frame-S.start)*24+110+'px';t.appendChild(ph);
}
function syncUI(){
 const l=cur();if(!l)return;$('lname').value=l.name;$('px').value=l.x;$('py').value=l.y;$('rot').value=l.rotation;$('scale').value=l.scale;$('opacity').value=l.opacity;$('blend').value=l.blend;$('frame').value=S.frame;$('onionPrev').value=S.onionPrev;$('onionNext').value=S.onionNext;$('fps').value=S.fps;$('end').value=S.end;$('color').value=S.color;$('size').value=S.size;$('onion').checked=S.onion;
}
function go(f){S.frame=Math.max(S.start,Math.min(S.end,Math.round(f)));render()}
function step(n){go(S.frame+n)}
function togglePlay(){S.playing=!S.playing;$('play').textContent=S.playing?'❚❚':'▶';clearInterval(timer);if(S.playing)timer=setInterval(()=>{if(S.frame>=S.end){S.playing=false;$('play').textContent='▶';clearInterval(timer)}else go(S.frame+1)},1000/S.fps)}
function addLayer(){S.layers.push(makeLayer('Layer '+(S.layers.length+1)));S.sel=S.layers.length-1;pushHistory();render()}
function duplicateLayer(){const l=JSON.parse(JSON.stringify(cur()));l.name+=' Copy';S.layers.splice(S.sel+1,0,l);S.sel++;pushHistory();render()}
function deleteLayer(){if(S.layers.length<=1)return;S.layers.splice(S.sel,1);S.sel=Math.min(S.sel,S.layers.length-1);pushHistory();render()}
function moveLayer(dir){const n=S.sel+dir;if(n<0||n>=S.layers.length)return;[S.layers[S.sel],S.layers[n]]=[S.layers[n],S.layers[S.sel]];S.sel=n;pushHistory();render()}
function renameLayer(){cur().name=$('lname').value.trim()||'Layer';pushHistory();render()}
function resetTransform(){const l=cur();l.x=l.y=l.rotation=0;l.scale=1;l.opacity=1;insertTransformKey(false);pushHistory();render()}
function insertTransformKey(history=true){const l=cur();l.keys[S.frame]={x:l.x,y:l.y,rotation:l.rotation,scale:l.scale,opacity:l.opacity,pivotX:l.pivotX,pivotY:l.pivotY};if(history)pushHistory();render()}
function insertKey(){ensureFrame();insertTransformKey(false);pushHistory();render()}
function deleteKey(){delete cur().frames[S.frame];delete cur().keys[S.frame];pushHistory();render()}
function clearFrame(){if(!cur().frames[S.frame]&&!cur().keys[S.frame])return;delete cur().frames[S.frame];delete cur().keys[S.frame];pushHistory();render()}
function copyFrame(){clipboard=JSON.stringify({frames:cur().frames[S.frame]||[],key:cur().keys[S.frame]||null})}
function pasteFrame(){if(!clipboard)return;const x=JSON.parse(clipboard);cur().frames[S.frame]=x.frames;if(x.key)cur().keys[S.frame]=x.key;pushHistory();render()}
function duplicateFrame(){copyFrame();go(Math.min(S.end,S.frame+1));pasteFrame()}
function mirrorFrame(){const d=cur().frames[S.frame];if(!d)return;for(const s of d){if(s.type==='path')s.pts.forEach(p=>p[0]=C.width-p[0]);else if(s.x!==undefined)s.x=C.width-s.x;if(s.x1!==undefined){s.x1=C.width-s.x1;s.x2=C.width-s.x2}}pushHistory();render()}
function pointerPos(e){const r=C.getBoundingClientRect();return[(e.clientX-r.left)*C.width/r.width,(e.clientY-r.top)*C.height/r.height]}
function pointerDown(e){
 if(e.button!==0||cur().locked)return;drawing=true;start=pointerPos(e);startTransform=start;
 if(S.tool==='select'){
  const d=cur().frames[S.frame]||nearestFrame(cur(),S.frame)||[];
  const hit=[];
  for(let i=d.length-1;i>=0;i--){const b=strokeBounds(d[i]);if(b&&start[0]>=b.x-8&&start[0]<=b.x+b.w+8&&start[1]>=b.y-8&&start[1]<=b.y+b.h+8){hit.push(i);break}}
  if(hit.length){selectedStrokes=hit;selection=strokeBounds(d[hit[0]]);startTransform=start;return}
  selectedStrokes=[];return
}
if(S.tool==='pivot'){return}
 ensureFrame();
 if(S.tool==='brush'||S.tool==='eraser'){current={type:'path',pts:[start],color:S.color,size:S.tool==='eraser'?Math.max(10,S.size):S.size,fill:false,erase:S.tool==='eraser'};cur().frames[S.frame].push(current)}
}
function smoothPoint(p){
 const n=+$('stabilizer').value;if(!n)return p;if(!current||current.pts.length<n)return p;let a=current.pts.slice(-n);return[a.reduce((s,x)=>s+x[0],0)/a.length,a.reduce((s,x)=>s+x[1],0)/a.length]
}
function pointerMove(e){
 if(!drawing)return;const p=pointerPos(e);
 if(S.tool==='select'){
  selection={x:Math.min(start[0],p[0]),y:Math.min(start[1],p[1]),w:Math.abs(p[0]-start[0]),h:Math.abs(p[1]-start[1])};
  render();return}
 if(S.tool==='pivot'){const l=cur();l.pivotX=p[0]-C.width/2-l.x;l.pivotY=p[1]-C.height/2-l.y;render();return}
 if(S.tool==='select'&&selectedStrokes.length){

function pointerUp(e){
 if(!drawing)return;drawing=false;const p=pointerPos(e);
 if(S.tool==='select'){selection={x:Math.min(start[0],p[0]),y:Math.min(start[1],p[1]),w:Math.abs(p[0]-start[0]),h:Math.abs(p[1]-start[1])};render();return}
 if(S.tool==='pivot'){pushHistory();render();return}
 if(['line','rect','ellipse'].includes(S.tool)){const d=cur().frames[S.frame];if(S.tool==='line')d.push({type:'line',x1:start[0],y1:start[1],x2:p[0],y2:p[1],color:S.color,size:S.size});if(S.tool==='rect')d.push({type:'rect',x:Math.min(start[0],p[0]),y:Math.min(start[1],p[1]),w:Math.abs(p[0]-start[0]),h:Math.abs(p[1]-start[1]),color:S.color,size:S.size,fill:$('fillShapes').checked});if(S.tool==='ellipse')d.push({type:'ellipse',x:(start[0]+p[0])/2,y:(start[1]+p[1])/2,rx:Math.abs(p[0]-start[0])/2,ry:Math.abs(p[1]-start[1])/2,color:S.color,size:S.size,fill:$('fillShapes').checked})}

function drawSelection(){if(!selection)return;ctx.save();ctx.setLineDash([6,4]);ctx.strokeStyle='#f2a33d';ctx.fillStyle='#f2a33d22';ctx.lineWidth=1;ctx.fillRect(selection.x,selection.y,selection.w,selection.h);ctx.strokeRect(selection.x+.5,selection.y+.5,selection.w,selection.h);ctx.restore()}
function drawPreview(a,b){ctx.save();ctx.globalAlpha=.6;ctx.strokeStyle=S.color;ctx.lineWidth=S.size;ctx.setLineDash([6,4]);ctx.beginPath();if(S.tool==='line'){ctx.moveTo(a[0],a[1]);ctx.lineTo(b[0],b[1])}if(S.tool==='rect')ctx.rect(Math.min(a[0],b[0]),Math.min(a[1],b[1]),Math.abs(b[0]-a[0]),Math.abs(b[1]-a[1]));if(S.tool==='ellipse')ctx.ellipse((a[0]+b[0])/2,(a[1]+b[1])/2,Math.abs(b[0]-a[0])/2,Math.abs(b[1]-a[1])/2,0,0,Math.PI*2);ctx.stroke();ctx.restore()}
function bucket(p){
 ensureFrame();
 const off=document.createElement('canvas');off.width=C.width;off.height=C.height;
 const ox=off.getContext('2d',{willReadFrequently:true});

 const l=cur(),d=nearestFrame(l,S.frame);

function drawStrokesToContext(target,arr){
 for(const s of arr){target.beginPath();target.lineWidth=s.size;target.lineCap='round';target.lineJoin='round';target.strokeStyle=s.color;target.fillStyle=s.color;

  else if(s.type==='line'){target.moveTo(s.x1,s.y1);target.lineTo(s.x2,s.y2);target.stroke()}
  else if(s.type==='rect'){target.rect(s.x,s.y,s.w,s.h);s.fill?target.fill():target.stroke()}
  else if(s.type==='ellipse'){target.ellipse(s.x,s.y,Math.abs(s.rx),Math.abs(s.ry),0,0,Math.PI*2);s.fill?target.fill():target.stroke()}

}
function strokeBounds(s){let xs=[],ys=[];if(s.type==='path'){xs=s.pts.map(p=>p[0]);ys=s.pts.map(p=>p[1])}else if(s.type==='line'){xs=[s.x1,s.x2];ys=[s.y1,s.y2]}else if(s.type==='rect'){xs=[s.x,s.x+s.w];ys=[s.y,s.y+s.h]}else if(s.type==='ellipse'){xs=[s.x-s.rx,s.x+s.rx];ys=[s.y-s.ry,s.y+s.ry]}else return null;return{x:Math.min(...xs),y:Math.min(...ys),w:Math.max(...xs)-Math.min(...xs),h:Math.max(...ys)-Math.min(...ys)}}
function strokeIntersectsSelection(s,r){let xs=[],ys=[];if(s.type==='path'){xs=s.pts.map(p=>p[0]);ys=s.pts.map(p=>p[1])}else if(s.type==='line'){xs=[s.x1,s.x2];ys=[s.y1,s.y2]}else if(s.type==='rect'){xs=[s.x,s.x+s.w];ys=[s.y,s.y+s.h]}else if(s.type==='ellipse'){xs=[s.x-s.rx,s.x+s.rx];ys=[s.y-s.ry,s.y+s.ry]}else return false;const x=Math.min(...xs),y=Math.min(...ys),w=Math.max(...xs)-x,h=Math.max(...ys)-y;return x<r.x+r.w&&x+w>r.x&&y<r.y+r.h&&y+h>r.y}

[$('px'),$('py'),$('rot'),$('scale'),$('opacity'),$('blend')].forEach(x=>x.onchange=()=>{const l=cur();l.x=+$('px').value;l.y=+$('py').value;l.rotation=+$('rot').value;l.scale=Math.max(.01,+$('scale').value);l.opacity=Math.max(0,Math.min(1,+$('opacity').value));l.blend=$('blend').value;l.keys[S.frame]={x:l.x,y:l.y,rotation:l.rotation,scale:l.scale,opacity:l.opacity};pushHistory();render()});

function saveProject(){const blob=new Blob([JSON.stringify(cleanProject(),null,2)],{type:'application/json'});download(blob,'keyframe-project.json')}
function openProject(){$('file').value='';$('file').onchange=()=>{const f=$('file').files[0];if(!f)return;const r=new FileReader();r.onload=()=>{try{const x=JSON.parse(r.result);if(!x.layers||!Array.isArray(x.layers))throw Error('Invalid project');S=Object.assign(S,x,{undo:[],redo:[],playing:false});pushHistory();render()}catch(e){alert('Could not open project: '+e.message)}};r.readAsText(f)};$('file').click()}

async function exportWebM(){if(!window.MediaRecorder){alert('WebM export is not supported in this browser.');return}const stream=C.captureStream(S.fps),rec=new MediaRecorder(stream,{mimeType:'video/webm'}),chunks=[];rec.ondataavailable=e=>e.data.size&&chunks.push(e.data);const done=new Promise(resolve=>rec.onstop=resolve);const old=S.frame;rec.start();for(let f=S.start;f<=S.end;f++){go(f);await new Promise(r=>setTimeout(r,1000/S.fps))}rec.stop();await done;go(old);download(new Blob(chunks,{type:'video/webm'}),'animation.webm')}
document.addEventListener('keydown',e=>{if(e.target.matches('input,select'))return;const k=e.key.toLowerCase();if(k==='b')S.tool='brush';else if(k==='e')S.tool='eraser';else if(k==='g')S.tool='move';else if(k==='r')S.tool='rotate';else if(k==='s')S.tool='scale';else if(k==='v')S.tool='select';else if(k==='p')S.tool='pivot';else if(k==='f')S.tool='fill';else if(k==='i')insertKey();else if(k==='delete')deleteKey();else if(k===' ')togglePlay();else if(e.key==='ArrowRight')step(1);else if(e.key==='ArrowLeft')step(-1);else if(e.ctrlKey&&k==='z'){e.preventDefault();undo()}else if(e.ctrlKey&&k==='y'){e.preventDefault();redo()}document.querySelectorAll('#tools button').forEach(b=>b.classList.toggle('active',b.dataset.tool===S.tool))});
